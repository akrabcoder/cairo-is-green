<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>القاهرة الخضراء — Cairo is Green</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: 'Cairo', sans-serif; background: #fcf8ef; }
  .site-header { background: #06241b; color: #f3e3b0; padding: 15px; text-align: center; }
  .site-header h1 { font-family: 'Amiri', serif; margin: 0; font-size: 24px; }
  .map-section { padding: 20px; }
  .map-shell { height: 600px; border-radius: 15px; overflow: hidden; border: 2px solid #c9a227; }
  #map { height: 100%; width: 100%; }
</style>
</head>
<body>

<header class="site-header">
  <h1>القاهرة الخضراء</h1>
  <p>نسخة تجريبية - الخريطة</p>
</header>

<section class="map-section">
  <div class="map-shell">
    <div id="map"></div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // إعداد الخريطة
    const map = L.map('map').setView([30.0444, 31.2357], 12);
    
    // تحميل شكل الخريطة
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // إضافة دبوس تجريبي في الزمالك
    L.marker([30.0605, 31.2197]).addTo(map)
      .bindPopup('<b>حي الزمالك</b><br>بحاجة لزراعة 60 شجرة');
  });
</script>
</body>
</html>
